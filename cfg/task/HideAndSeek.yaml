name: HideAndSeek

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 5
  max_episode_length: 800

drone_model: Crazyflie
force_sensor: false
time_encoding: true

action_transform: PIDrate

# exp
max_agents: 3
num_agents: 3

# flag
use_partial_obs: 1
use_eval: 1 # use_eval = 1 for evaluation, fixed init states
use_random_cylinder: 0 # set use_random_cylinder = 0 when use_eval = 1; use_random_cylinder = 0, means scenario_flag is valid
scenario_flag: 'passage_debug' # 'empty', 'wall', 'narrow_gap', 'random', 'passage'
cylinder:
  size: 0.1
  fixed_num: null # None: random num and pos, else only fixed num, random pos
  min_num: 4
  max_num: 6
  obs_max_cylinder: 3

# TP net param
history_step: 10
future_predcition_step: 5
window_step: 1
use_obstacles: 0

arena_size: 0.9
max_height: 1.2
v_drone: 1.0
v_prey: 1.3

dist_reward_coef: 1.0
catch_reward_coef: 60.0
detect_reward_coef: 0.0
collision_coef: 100.0
speed_coef: 10.0
smoothness_coef: 20.0

# env param
catch_radius: 0.3
drone_detect_radius: 100.0
target_detect_radius: 100.0
collision_radius: 0.07